# alertmanager/alertmanager.yml
# Alertmanager configuration for ML service alerts
# Student: Siddhant Udavant (Roll No: 20, PRN: 12414447, Branch: AI&DS, Div: F)

global:
  resolve_timeout: 1m

route:
  receiver: "default-receiver"
  group_by: ["alertname", "severity"]
  group_wait: 10s
  group_interval: 30s
  repeat_interval: 1h

receivers:
  - name: "default-receiver"
    # In production, webhooks, Slack, or email notifications are added here

