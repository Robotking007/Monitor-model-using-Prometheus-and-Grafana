# docker-compose.yml
# Assignment 8: Monitor a Machine Learning Model using Prometheus and Grafana
# Student: Siddhant Udavant (Roll No: 20, PRN: 12414447, Branch: AI&DS, Div: F)

networks:
  mlops-monitoring-net:
    driver: bridge

volumes:
  prometheus-data:
  grafana-data:

services:
  # 1. FastAPI Model Prediction Service
  model-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ml-model-service
    restart: unless-stopped
    ports:
      - "8000:8000"
    networks:
      - mlops-monitoring-net

  # 2. Prometheus Metrics Time-Series Database
  prometheus:
    image: prom/prometheus:v2.48.0
    container_name: mlops-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
      - "--storage.tsdb.retention.time=15d"
      - "--web.enable-lifecycle"
    depends_on:
      - model-service
      - alertmanager
    networks:
      - mlops-monitoring-net

  # 3. Alertmanager for Alert Grouping and Notification
  alertmanager:
    image: prom/alertmanager:v0.26.0
    container_name: mlops-alertmanager
    restart: unless-stopped
    ports:
      - "9093:9093"
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    networks:
      - mlops-monitoring-net

  # 4. Node Exporter for Host Infrastructure Metrics
  node-exporter:
    image: prom/node-exporter:v1.7.0
    container_name: mlops-node-exporter
    restart: unless-stopped
    ports:
      - "9100:9100"
    networks:
      - mlops-monitoring-net

  # 5. Grafana Visualization Platform
  grafana:
    image: grafana/grafana:10.2.0
    container_name: mlops-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_USERS_DEFAULT_THEME=light
    volumes:
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards/json:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - mlops-monitoring-net

